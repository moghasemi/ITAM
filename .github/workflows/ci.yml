name: Django CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ITAM_DEBUG: "1"
      ITAM_SECRET_KEY: "ci-only-not-for-production"
      ITAM_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite
        run: python manage.py test --verbosity 2

  deploy-script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $paths = @("deploy/install_service.ps1", "deploy/backup.ps1", "HWAgent/agent.ps1")
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax validation failed: $path"
            }
          }
      - name: Validate HWAgent browser JavaScript
        shell: pwsh
        run: |
          $html = Get-Content "HWAgent/index.html" -Raw
          $scriptMatches = [regex]::Matches($html, '(?is)<script\\b[^>]*>(.*?)</script>')
          $inlineScript = $scriptMatches | Where-Object { $_.Groups[1].Value.Trim().Length -gt 0 } | Select-Object -First 1
          if (-not $inlineScript) {
            throw "HWAgent inline JavaScript block was not found."
          }
          $tempScript = Join-Path $env:RUNNER_TEMP "hwagent-inline.js"
          Set-Content -Path $tempScript -Value $inlineScript.Groups[1].Value -NoNewline
          node --check $tempScript
      - name: Guard production server launcher
        shell: pwsh
        run: |
          $launcher = Get-Content "deploy/run_server.bat" -Raw
          if ($launcher -match "runserver|ITAM_ALLOWED_HOSTS=\*|migrate --noinput") {
            throw "Production launcher contains an unsafe fallback or implicit migration."
          }
          if ($launcher -notmatch "127\.0\.0\.1" -or $launcher -notmatch "waitress") {
            throw "Production launcher must use Waitress on loopback."
          }
