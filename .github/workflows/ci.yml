name: Django CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ITAM_DEBUG: "1"
      ITAM_SECRET_KEY: "ci-only-not-for-production"
      ITAM_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite
        run: python manage.py test --verbosity 2


  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itam_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d itam_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ITAM_DEBUG: "1"
      ITAM_SECRET_KEY: "ci-only-not-for-production"
      ITAM_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      ITAM_DB_ENGINE: "postgresql"
      ITAM_DB_NAME: "itam_ci"
      ITAM_DB_USER: "postgres"
      ITAM_DB_PASSWORD: "postgres"
      ITAM_DB_HOST: "127.0.0.1"
      ITAM_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: PostgreSQL migration and test suite
        run: python manage.py test --verbosity 2


  production-settings-check:
    runs-on: ubuntu-latest
    env:
      ITAM_DEBUG: "0"
      ITAM_SECRET_KEY: "CI-ONLY-NOT-A-REAL-SECRET-KEY-0123456789abcdef0123456789abcdef"
      ITAM_ALLOWED_HOSTS: "itam.example.test"
      ITAM_DB_ENGINE: "postgresql"
      ITAM_DB_NAME: "itam_ci"
      ITAM_DB_USER: "itam_ci"
      ITAM_DB_PASSWORD: "ci-only-not-production"
      ITAM_DB_HOST: "127.0.0.1"
      ITAM_DB_PORT: "5432"
      ITAM_USE_PROXY_SSL_HEADER: "1"
      ITAM_SECURE_SSL_REDIRECT: "1"
      ITAM_HSTS_SECONDS: "31536000"
      ITAM_SESSION_COOKIE_SECURE: "1"
      ITAM_CSRF_COOKIE_SECURE: "1"
      ITAM_CSRF_TRUSTED_ORIGINS: "https://itam.example.test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django production deployment checks
        run: python manage.py check --deploy

  deploy-script-validation:
    # These steps perform syntax checks only; real Windows installation/sync
    # remains a separate manual acceptance test on a target machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $paths = @("deploy/install_service.ps1", "deploy/backup.ps1", "HWAgent/agent.ps1")
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax validation failed: $path"
            }
          }
      - name: Validate HWAgent browser JavaScript
        shell: pwsh
        run: |
          $html = Get-Content "HWAgent/index.html" -Raw
          $scriptMatches = [regex]::Matches($html, '(?is)<script\b[^>]*>(.*?)</script>')
          $inlineScript = $scriptMatches | Where-Object { $_.Groups[1].Value.Trim().Length -gt 0 } | Select-Object -First 1
          if (-not $inlineScript) {
            throw "HWAgent inline JavaScript block was not found."
          }
          $tempScript = Join-Path $env:RUNNER_TEMP "hwagent-inline.js"
          Set-Content -Path $tempScript -Value $inlineScript.Groups[1].Value -NoNewline
          node --check $tempScript
      - name: Guard production server launcher
        shell: pwsh
        run: |
          $launcher = Get-Content "deploy/run_server.bat" -Raw
          if ($launcher -match "runserver|ITAM_ALLOWED_HOSTS=\*|migrate --noinput") {
            throw "Production launcher contains an unsafe fallback or implicit migration."
          }
          if ($launcher -notmatch "127\.0\.0\.1" -or $launcher -notmatch "waitress") {
            throw "Production launcher must use Waitress on loopback."
          }
