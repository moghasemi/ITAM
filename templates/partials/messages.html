{% if messages %}
<div class="messages">
  {% for message in messages %}
    <div class="kt-alert {% if 'error' in message.tags %}kt-alert-destructive{% elif 'warning' in message.tags %}kt-alert-warning{% elif 'success' in message.tags %}kt-alert-success{% elif 'info' in message.tags %}kt-alert-info{% else %}kt-alert-mono{% endif %} alert alert-{{ message.tags }}" role="status">
      <div class="kt-alert-content"><span>{{ message }}</span></div>
      <button type="button" class="kt-alert-close alert-close" data-dismiss="alert" aria-label="بستن پیام">×</button>
    </div>
  {% endfor %}
</div>
{% endif %}
