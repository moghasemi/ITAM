{% extends "base.html" %}

{% block content %}
<div class="card kt-card" style="max-width:620px">
  <div class="card-head kt-card-header"><h2 class="card-title">افزودن پیوست به {{ asset.asset_tag }}</h2></div>
  <div class="card-body kt-card-content">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include "partials/form_fields.html" with form=form %}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary kt-btn kt-btn-primary">بارگذاری</button>
        <a class="btn btn-ghost kt-btn kt-btn-light" href="{% url 'assets:detail' asset.pk %}">بازگشت</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
