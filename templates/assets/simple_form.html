{% extends "base.html" %}

{% block content %}
<div class="card kt-card" style="max-width:760px">
  <div class="card-body kt-card-content">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% include "partials/form_fields.html" with form=form %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary kt-btn kt-btn-primary">ذخیره</button>
        <a class="btn btn-ghost kt-btn kt-btn-light" href="{{ back_url|default:'/' }}">بازگشت</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
