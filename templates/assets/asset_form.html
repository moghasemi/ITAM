{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:1000px">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-grid">
        {% include "partials/form_fields.html" with form=form %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-lg">ذخیره دارایی</button>
        <a class="btn btn-ghost" href="{% url 'assets:list' %}">بازگشت به فهرست</a>
      </div>
    </form>
  </div>
</div>
  <script>
  (function () {
    const category = document.getElementById("id_category");
    if (!category) return;
    const computerIds = (category.dataset.computingCategoryIds || "").split(",").filter(Boolean);
    const computerFields = document.querySelectorAll("[data-computer-only]");
    const peripheralFields = document.querySelectorAll("[data-peripheral-only]");
    function updateAssetFields() {
      const isComputer = computerIds.includes(category.value);
      computerFields.forEach((field) => {
        const row = field.closest(".form-row");
        if (row) row.hidden = !isComputer;
      });
      peripheralFields.forEach((field) => {
        const row = field.closest(".form-row");
        if (row) row.hidden = isComputer;
      });
    }
    category.addEventListener("change", updateAssetFields);
    updateAssetFields();
  })();
  </script>
{% endblock %}
