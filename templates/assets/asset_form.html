{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:1000px">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-grid">
        {% include "partials/form_fields.html" with form=form %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-lg">ذخیره دارایی</button>
        <a class="btn btn-ghost" href="{% url 'assets:list' %}">بازگشت به فهرست</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
