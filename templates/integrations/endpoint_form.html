{% extends "base.html" %}

{% block content %}
<div class="card kt-card" style="max-width:860px">
  <div class="card-head kt-card-header"><h2 class="card-title">مقصد ارسال رخدادها به مدیریت</h2></div>
  <div class="card-body kt-card-content">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% include "partials/form_fields.html" with form=form %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary kt-btn kt-btn-primary">ذخیره مقصد</button>
        <a class="btn btn-ghost kt-btn kt-btn-light" href="{% url 'integrations:endpoint_list' %}">بازگشت</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
