{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:560px">
  <div class="card-body">
    <p class="muted">تعیین گذرواژه جدید برای کاربر <strong>{{ object.display_name }}</strong></p>
    <form method="post">
      {% csrf_token %}
      {% include "partials/form_fields.html" with form=form %}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">ثبت گذرواژه جدید</button>
        <a class="btn btn-ghost" href="{% url 'accounts:user_list' %}">بازگشت</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
