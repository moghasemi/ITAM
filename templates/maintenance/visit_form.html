{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:820px">
  <div class="card-head"><h2 class="card-title">ثبت / ویرایش نوبت بازدید دوره‌ای</h2></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% include "partials/form_fields.html" with form=form %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">ذخیره بازدید</button>
        <a class="btn btn-ghost" href="{% url 'maintenance:visit_list' %}">بازگشت</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
