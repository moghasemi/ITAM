{% extends "base.html" %}
{% block content %}
<div class="page-header"><div><h1>{{ page_title }}</h1></div></div>
<div class="card">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions"><button class="btn btn-primary" type="submit">ذخیره</button><a class="btn btn-secondary" href="javascript:history.back()">بازگشت</a></div>
  </form>
</div>
{% endblock %}
