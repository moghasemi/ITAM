{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:900px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% include "partials/form_fields.html" with form=form %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">ذخیره پیمانکار</button>
        <a class="btn btn-ghost" href="{% url 'org:contractor_list' %}">بازگشت</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
