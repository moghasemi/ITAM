{% extends "base.html" %}

{% block content %}
<div class="card kt-card" style="max-width:860px">
  <div class="card-body kt-card-content">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-grid">
        {% include "partials/form_fields.html" with form=form %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary kt-btn kt-btn-primary">ذخیره</button>
        <a class="btn btn-ghost kt-btn kt-btn-light" href="{{ back_url|default:'/' }}">بازگشت</a>
      </div>
    </form>
  </div>
</div>
{% if form.province and form.parent_unit %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const provinceSelect = document.getElementById("id_province");
    const countySelect = document.getElementById("id_parent_unit");
    if (!provinceSelect || !countySelect) return;

    function filterCounties() {
      const provinceId = provinceSelect.value;
      Array.from(countySelect.options).forEach(function (option) {
        if (!option.value) {
          option.hidden = false;
          option.disabled = false;
          return;
        }
        const matchesProvince = option.dataset.provinceId === provinceId;
        option.hidden = !matchesProvince;
        option.disabled = !matchesProvince;
        if (!matchesProvince && option.selected) countySelect.value = "";
      });
      countySelect.disabled = !provinceId;
    }

    provinceSelect.addEventListener("change", filterCounties);
    filterCounties();
  });
</script>
{% endif %}
{% endblock %}
